# SPDX-License-Identifier: MIT
version = 1

# Metadata for original host sources kept byte-identical (especially recovery).
# Existing in-file notices remain authoritative; third-party trees are excluded
# from Git and do not acquire this license.
[[annotations]]
path = ["tools/*.py", "tools/*.sh", "tools/*.ps1", "tools/tests/*.py",
        "tools/ghidra/K40s*.java", "tools/diagnostics/*.S", "installer/*.ps1",
        "portkit/**/*.py", "tools/tests/toolkit/*.py", "pyproject.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 LG K40S Linux port contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["README.md", "AGENTS.md", "ports/README.md", "docs/architecture.md", "docs/development.md",
        "docs/refactor-status.md", "docs/open-source-reuse-audit.md",
        "docs/bmw-kernel-touch-re.md", "docs/bmw-kernel-battery-re.md",
        "boards/**/*.json", "boards/**/README.md", "boards/**/requirements-toolkit.txt",
        "components/**", "manifests/*", "historical/*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 LG K40S Linux port contributors"
SPDX-License-Identifier = "MIT"
